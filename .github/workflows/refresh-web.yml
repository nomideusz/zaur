name: Refresh zaur.app templates

# zaur.app builds its Railway templates table from Dispatcher's catalog, GitHub
# and Railway at prerender (apps/web/src/lib/templates.ts), so it only changes on
# a rebuild. Hourly this fingerprints the template repos, Dispatcher's published
# templates and their kinds, and the UTC day (so the project counts refresh at
# least daily); when that changes, it calls the web app's Dokploy deploy hook.
# A template repo can trigger it at once with
#   gh api repos/nomideusz/zaur/dispatches -f event_type=railway-templates

on:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [railway-templates]
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint the templates
        id: fp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repos=$(gh api -X GET search/repositories --paginate \
            -f q='topic:railway-template archived:false is:public user:two-workspaces' -f per_page=100 \
            --jq '.items[] | "\(.full_name) \(.pushed_at)"' | sort)
          # Dispatcher down: leave it out rather than fail; the build falls back to GitHub.
          published=$(curl -fsS --max-time 30 https://dispatcher.zaur.app/api/catalog \
            | jq -r '.templates[] | "\(.code) \(.kind) \(.name)"' | sort || true)
          sum=$(printf '%s\n%s\n%s\n' "$repos" "$published" "$(date -u +%F)" | sha256sum | cut -c1-16)
          echo "sum=$sum" >> "$GITHUB_OUTPUT"

      - name: Check whether this fingerprint was built
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .seen
          key: templates-${{ steps.fp.outputs.sum }}
          lookup-only: true

      - name: Rebuild zaur.app
        if: steps.seen.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        env:
          HOOK: ${{ secrets.DOKPLOY_WEB_DEPLOY_HOOK }}
        # Dokploy only deploys a push to main that touches a watched path.
        run: |
          curl -sS -X POST "$HOOK" -H 'content-type: application/json' -H 'x-github-event: push' \
            -d '{"ref":"refs/heads/main","head_commit":{"message":"Refresh Railway templates"},"commits":[{"modified":["apps/web/src/lib/templates.ts"]}]}' \
            | tee /dev/stderr | grep -q 'deployed successfully'

      - if: steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .seen

      - if: steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .seen
          key: templates-${{ steps.fp.outputs.sum }}
