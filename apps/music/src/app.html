<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Icons: two beamed notes on a violet tile, drawn by scripts/generate-icons.py -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Zaur Music" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- The canvas (--z-canvas): what the top of every page is painted with. -->
		<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f141a" media="(prefers-color-scheme: dark)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
