<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#070b10" media="(prefers-color-scheme: dark)" />
		<script>
			// The theme before first paint, so a dark preference does not flash light.
			// Same key and shape as #lib/settings; "system" leaves the attribute off
			// and lets prefers-color-scheme decide.
			try {
				var theme = JSON.parse(localStorage.getItem('mail2.prefs') || '{}').theme;
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
