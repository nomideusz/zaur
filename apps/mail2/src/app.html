<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Icons are the ZA/UR mark: favicon.svg by hand, PNGs from scripts/generate-icons.py -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="48x48" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="apple-mobile-web-app-title" content="Zaur" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, interactive-widget=resizes-content"
		/>
		<!--
			The colour a browser paints around the app: an installed iOS app fills
			the status bar strip with it, Android the toolbar. It has to be
			`--z-surface`, the colour of the app's own top bar — it used to be
			`--z-ground`, which only shows past the 1780px ceiling, so a phone got a
			grey band above a white app and whatever blur iOS draws up there had a
			hard edge to smear. Same colour above and below, nothing to blur.
		-->
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#161d26" media="(prefers-color-scheme: dark)" />
		<script>
			// The theme before first paint, so a dark preference does not flash light.
			// Same key and shape as #lib/settings; "system" leaves the attribute off
			// and lets prefers-color-scheme decide.
			try {
				var theme = JSON.parse(localStorage.getItem('mail2.prefs') || '{}').theme;
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
