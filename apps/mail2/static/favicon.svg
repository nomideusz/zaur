<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
	<!-- ZaurMark.svelte's Z fold on a full tile, scaled to 85% with a heavier stroke so it holds at 16px. -->
	<style>
		.tile { fill: #ffffff; }
		.z { stroke: #334155; }
		@media (prefers-color-scheme: dark) {
			.tile { fill: #161d26; }
			.z { stroke: #b3bfcd; }
		}
	</style>
	<rect class="tile" width="16" height="16" rx="3.5" />
	<path class="z" transform="translate(8 8) scale(0.85) translate(-8 -8)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M3 3H13L3 13H13" />
</svg>
