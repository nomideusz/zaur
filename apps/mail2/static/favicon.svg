<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
	<!-- ZaurMark.svelte's Z fold on a full tile, scaled to 85% with a heavier stroke so it holds at 16px. -->
	<style>
		.tile { fill: #ffffff; }
		.z { stroke: #e11d48; } .r { stroke: #0d9488; }
		@media (prefers-color-scheme: dark) {
			.tile { fill: #161d26; }
			.z { stroke: #f08ea3; } .r { stroke: #88c7bf; }
		}
	</style>
	<rect class="tile" width="16" height="16" rx="3.5" />
	<g transform="translate(8 8) scale(0.85) translate(-8 -8)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
		<path class="z" d="M3 3H13L3 13" />
		<path class="r" d="M3 13H13" />
	</g>
</svg>
